    <style>
/* Dropzone Container Base Styling */
.dropzone {
    min-height: 90px !important;
    padding: 12px !important;
    border: 1px dashed #b9b9b9ff !important;
    background-color: #f8f9fa !important;
    border-radius: 8px !important;
    text-align: center;
    font-size: 13px;
    position: relative;
    transition: all 0.25s ease-in-out;
}

.dropzone:hover {
    border-color: #5f61e6 !important;
    background-color: #f3f4ff !important;
}

.dropzone .dz-message {
    margin: 10px 0 !important;
    padding: 0;
    color: #566a7f;
    font-weight: 500;
}

.dropzone .dz-message i {
    font-size: 2rem;
    color: #696cff;
    display: block;
    margin-bottom: 4px;
}

.dropzone .dz-message h3 {
    font-size: 14px;
    margin: 0;
    color: #566a7f;
}

/* Dropzone Preview Card Styling */
.dropzone .dz-preview {
    position: relative;
    display: inline-block;
    vertical-align: top;
    margin: 8px;
    min-height: 90px;
    border-radius: 8px;
    background: #ffffff;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    border: 1px solid #e7e7e8;
    overflow: hidden;
    padding: 8px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.dropzone .dz-preview:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
}

.dropzone .dz-preview .dz-image {
    border-radius: 6px;
    overflow: hidden;
    width: 60px;
    height: 60px;
    position: relative;
    display: block;
    margin: 0 auto;
}

.dropzone .dz-preview .dz-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.dropzone .dz-preview .dz-details {
    padding: 4px 2px;
    font-size: 11px;
    text-align: center;
    color: #566a7f;
}

.dropzone .dz-preview .dz-details .dz-filename {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 110px;
    font-weight: 600;
}

.dropzone .dz-preview .dz-details .dz-size {
    font-size: 10px;
    color: #8592a3;
    margin-top: 1px;
}

/* Upload Progress Bar (Until Upload Complete) */
.dropzone .dz-preview .dz-progress {
    position: absolute;
    left: 8px;
    right: 8px;
    bottom: 28px;
    height: 8px;
    background: #e9ecef;
    border-radius: 4px;
    overflow: hidden;
    z-index: 30;
    opacity: 1;
    transition: opacity 0.3s ease;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
}

/* Progress bar fill indicator */
.dropzone .dz-preview .dz-progress .dz-upload {
    display: block;
    height: 100%;
    width: 0%;
    background: linear-gradient(45deg, #696cff 25%, #787bff 25%, #787bff 50%, #696cff 50%, #696cff 75%, #787bff 75%, #787bff);
    background-size: 1rem 1rem;
    animation: dz-progress-stripes 1s linear infinite;
    border-radius: 4px;
    transition: width 0.15s ease-in-out;
}

@keyframes dz-progress-stripes {
    0% { background-position: 1rem 0; }
    100% { background-position: 0 0; }
}

/* Processing Overlay (Shown until upload complete) */
.dropzone .dz-preview.dz-processing:not(.dz-complete)::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.82);
    z-index: 25;
    backdrop-filter: blur(1px);
}

.dropzone .dz-preview.dz-processing:not(.dz-complete)::after {
    content: 'Uploading...';
    position: absolute;
    top: 18px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    color: #696cff;
    z-index: 26;
    animation: dz-pulse-upload 1.2s infinite ease-in-out;
}

@keyframes dz-pulse-upload {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
}

/* Hide progress bar and overlay once upload is complete */
.dropzone .dz-preview.dz-complete .dz-progress {
    opacity: 0;
    pointer-events: none;
}

.dropzone .dz-preview.dz-complete::before,
.dropzone .dz-preview.dz-complete::after {
    display: none;
}

/* Success Checkmark Badge */
.dropzone .dz-preview.dz-success .dz-success-mark {
    display: flex;
    align-items: center;
    justify-content: center;
    position: absolute;
    top: 4px;
    right: 4px;
    z-index: 35;
    width: 20px;
    height: 20px;
    color: #ffffff;
    background-color: #71dd37;
    border-radius: 50%;
    font-size: 12px;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
}

.dropzone .dz-preview.dz-success .dz-success-mark svg,
.dropzone .dz-preview.dz-success .dz-success-mark::before {
    content: '✓';
    font-weight: bold;
}

/* Error State Badge & Message (When File Upload Fails) */
.dropzone .dz-preview.dz-error {
    border: 2px solid #ff3e1d !important;
    background-color: #fff5f5 !important;
}

.dropzone .dz-preview.dz-error .dz-error-mark {
    display: flex !important;
    align-items: center;
    justify-content: center;
    position: absolute;
    top: 4px;
    right: 4px;
    z-index: 35;
    width: 22px;
    height: 22px;
    color: #ffffff;
    background-color: #ff3e1d;
    border-radius: 50%;
    font-size: 13px;
    box-shadow: 0 2px 5px rgba(255, 62, 29, 0.3);
}

.dropzone .dz-preview.dz-error .dz-error-mark::before {
    content: '✕';
    font-weight: bold;
}

.dropzone .dz-preview.dz-error .dz-error-message {
    display: flex !important;
    align-items: center;
    justify-content: center;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 24px;
    background: rgba(255, 245, 245, 0.96);
    color: #ff3e1d;
    padding: 6px;
    font-size: 11px;
    font-weight: 600;
    text-align: center;
    z-index: 30;
    border-radius: 6px 6px 0 0;
    word-break: break-word;
    box-shadow: inset 0 0 0 1px rgba(255, 62, 29, 0.2);
}

.dropzone .dz-preview.dz-error .dz-error-message span,
.dropzone .dz-preview.dz-error .dz-error-message [data-dz-errormessage] {
    display: block;
    max-width: 100%;
    line-height: 1.3;
}

/* Dropzone Form Validation Failure (When File is Missing / Not Uploaded) */
.dropzone.is-invalid,
.dropzone.error,
.dropzone.has-error {
    border-color: #ff3e1d !important;
    background-color: #fff5f5 !important;
    box-shadow: 0 0 0 0.2rem rgba(255, 62, 29, 0.15) !important;
}

.dropzone.is-invalid .dz-message,
.dropzone.error .dz-message,
.dropzone.has-error .dz-message {
    color: #ff3e1d !important;
}

.dropzone.is-invalid .dz-message i,
.dropzone.error .dz-message i,
.dropzone.has-error .dz-message i {
    color: #ff3e1d !important;
}

/* Error message label placement below dropzone container */
.dropzone + .invalid-feedback,
.dropzone + .error,
.dropzone + span.error,
.dropzone + div.error,
.dropzone.is-invalid ~ .invalid-feedback,
.dropzone.is-invalid ~ .error,
.dropzone.error ~ .error {
    display: block !important;
    color: #ff3e1d !important;
    font-size: 12px !important;
    font-weight: 500 !important;
    margin-top: 6px !important;
    text-align: left;
}

/* Remove Button / Link Styling */
.dropzone .dz-preview .dz-remove {
    display: block;
    margin-top: 4px;
    font-size: 11px;
    color: #ff3e1d !important;
    text-decoration: none;
    cursor: pointer;
    font-weight: 500;
    text-align: center;
    transition: color 0.2s ease;
    position: relative;
    z-index: 31;
}

.dropzone .dz-preview .dz-remove:hover {
    color: #ce1a00 !important;
    text-decoration: underline;
}
</style>

<script>
    AOS.init();
    
    jQuery(document).ready(function() {
        $('.select2_search').select2({});

        // Position table action dropdowns using the viewport ('fixed') instead of
        // their scrollable table wrapper, so they're never clipped by the
        // horizontal-scroll container and never need it forced open/visible.
        function initFixedStrategyDropdowns(container) {
            $(container).find('table.dataTable [data-bs-toggle="dropdown"]').each(function() {
                bootstrap.Dropdown.getOrCreateInstance(this, {
                    popperConfig: function(defaultConfig) {
                        return Object.assign({}, defaultConfig, {
                            strategy: 'fixed',
                            modifiers: (defaultConfig.modifiers || []).concat([{
                                name: 'flip',
                                options: {
                                    fallbackPlacements: ['top-start', 'top-end'],
                                    boundary: 'viewport',
                                    padding: 8
                                }
                            }])
                        });
                    }
                });
            });
        }
        initFixedStrategyDropdowns(document);
        $(document).on('draw.dt', function(e) {
            initFixedStrategyDropdowns(e.target);
        });

        // Move table action dropdown menus to <body> while open, so they render
        // fully outside the table's DOM subtree — immune to the table/card's own
        // stacking order, borders and scroll wrapper — instead of just visually
        // "fitting" inside the row/column space. Moved back to their original
        // spot in the table on close so DataTables' own row markup stays intact.
        $(document).on('show.bs.dropdown', 'table.dataTable [data-bs-toggle="dropdown"]', function(e) {
            var toggle = e.target;
            var menu = toggle.parentElement && toggle.parentElement.querySelector(':scope > .dropdown-menu');
            if (menu) {
                toggle._portalMenu = menu;
                toggle._portalHome = toggle.parentElement;
                document.body.appendChild(menu);
            }
        });

        $(document).on('hidden.bs.dropdown', 'table.dataTable [data-bs-toggle="dropdown"]', function(e) {
            var toggle = e.target;
            if (toggle._portalMenu && toggle._portalHome) {
                toggle._portalHome.appendChild(toggle._portalMenu);
                toggle._portalMenu = null;
                toggle._portalHome = null;
            }
        });

        // Global handler to prevent table action dropdowns from overlapping
        $(document).on('show.bs.dropdown', '.dropdown, .btn-group, td, tr', function(e) {
            var $target = $(e.target);
            var $tr = $target.closest('tr');
            var $td = $target.closest('td');

            if ($tr.length) {
                $tr.addClass('dropdown-open').css({ 'z-index': '99999', 'position': 'relative' });
            }
            if ($td.length) {
                $td.addClass('dropdown-open').css({ 'z-index': '99999', 'position': 'relative' });
            }
        });

        $(document).on('hidden.bs.dropdown', '.dropdown, .btn-group, td, tr', function(e) {
            var $target = $(e.target);
            var $tr = $target.closest('tr');
            var $td = $target.closest('td');

            if ($tr.length) {
                $tr.removeClass('dropdown-open').css({ 'z-index': '', 'position': '' });
            }
            if ($td.length) {
                $td.removeClass('dropdown-open').css({ 'z-index': '', 'position': '' });
            }
        });

        // Global form submission check for active Dropzone uploads
        $(document).on('submit', 'form', function(e) {
            var form = this;
            if (form.id === 'confirm_modal_submit_form') return;

            var isUploading = false;
            $(form).find('.dropzone').each(function() {
                if (this.dropzone) {
                    var uploading = this.dropzone.getUploadingFiles();
                    var queued = this.dropzone.getQueuedFiles();
                    if ((uploading && uploading.length > 0) || (queued && queued.length > 0)) {
                        isUploading = true;
                    }
                }
            });

            if (isUploading) {
                e.preventDefault();
                e.stopPropagation();
                if (typeof notyf !== 'undefined') {
                    notyf.error('Please wait until all file uploads are complete before submitting.');
                } else {
                    alert('Please wait until all file uploads are complete before submitting.');
                }
                return false;
            }
        });
    }); 

    if (typeof Dropzone !== 'undefined') {
        Dropzone.autoDiscover = false;
        if (Dropzone.prototype.defaultOptions) {
            Dropzone.prototype.defaultOptions.maxFilesize = 50;
            Dropzone.prototype.defaultOptions.acceptedFiles = ".jpeg,.jpg,.png,.gif,.pdf,.doc,.docx,.xls,.xlsx,.zip,.rar,.JPEG,.JPG,.PNG,.GIF,.PDF,.DOC,.DOCX,.XLS,.XLSX,.ZIP,.RAR";
        }
    }
</script>
