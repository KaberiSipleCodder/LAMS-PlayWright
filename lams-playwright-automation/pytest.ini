[pytest]
; Makes the project root importable so "from pages...." / "from config
; import ..." work from inside tests/ without extra __init__.py plumbing.
pythonpath = .
testpaths = tests
; --browser chromium --headed --slowmo=500 : the browser is always visible and
;   slightly slowed down, as before.
; --html=reports/report.html --self-contained-html : one readable HTML report
;   per run, with failure screenshots embedded in the file itself.
; -ra : short summary of failures / skips at the end.
; Tips:
;   faster local run (no 500ms slowdown):  python -m pytest --slowmo=0
;   headless run (override addopts):       python -m pytest -o addopts="--browser chromium --html=reports/report.html"
;   trace for failed tests:                python -m pytest --tracing=retain-on-failure
addopts =
    --browser chromium
    --headed
    --slowmo=500
    --html=reports/report.html
    --self-contained-html
    -ra
markers =
    smoke: quick, high-value tests
    e2e: full end-to-end business flows
    positive: tests that expect the app to accept / complete the action
    negative: validation / rejection tests (expected failures)
    land_bank: Land Bank Details (wizard Step 1) module tests
    technical_team: Technical Team (wizard Step 2) module tests
    commercial_financial: Commercial/Financial (wizard Step 3) module tests
    tc_id(number): explicit test case id (wins over the id in the test name)

